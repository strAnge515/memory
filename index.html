<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>

    <script src="./src/main.ts" type="module"></script>
  </head>
  <body>
    <main>
      <section id="home" class="home">
        <hgroup class="home__heading">
          <p class="home__subtitle">It's play time</p>
          <h1 class="home__title">Ready to play?</h1>
        </hgroup>
        <button id="play-button" class="btn btn--play">
          <img src="/img/icons/controller.svg" alt="" />
          <span>Play</span>
          <img src="/img/icons/arrow.svg" alt="" />
        </button>
        <span class="home__controller" aria-hidden="true"></span>
      </section>

      <section id="settings" class="settings is-hidden">
        <h1 class="settings__title">Settings</h1>

        <form class="settings__form" id="settings-form">
          <div class="settings__options">
            <fieldset class="settings__group">
              <legend>Game themes</legend>
              <label><input type="radio" name="theme" value="code-vibes" /> Code vibes theme</label>
              <label><input type="radio" name="theme" value="da-projects" /> DA Projects theme</label>
              <label><input type="radio" name="theme" value="food" /> Foods theme</label>
            </fieldset>

            <fieldset class="settings__group">
              <legend>Choose player</legend>
              <label><input type="radio" name="player" value="blue" /> Blue</label>
              <label><input type="radio" name="player" value="orange" /> Orange</label>
            </fieldset>

            <fieldset class="settings__group">
              <legend>Board size</legend>
              <label><input type="radio" name="size" value="16" /> 16 cards</label>
              <label><input type="radio" name="size" value="24" /> 24 cards</label>
              <label><input type="radio" name="size" value="36" /> 36 cards</label>
            </fieldset>
          </div>

          <div class="settings__preview">
            <div class="settings__preview-img"></div>

            <div class="settings__summary">
              <span class="settings__chosen" data-group="theme">Theme</span>
              <span class="settings__chosen" data-group="player">Player</span>
              <span class="settings__chosen" data-group="size">Board size</span>
              <button id="game-start-button" class="btn btn--start" type="submit" disabled>
                <img src="/img/icons/start.svg" alt="" />
                <span>Start</span>
              </button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
