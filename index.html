<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>

    <script src="./src/main.ts" type="module"></script>
  </head>
  <body>
    <main>
      <section id="home" class="home">
        <hgroup class="home__heading">
          <p class="home__subtitle">It's play time</p>
          <h1 class="home__title">Ready to play?</h1>
        </hgroup>
        <button id="play-button" class="btn btn--play">
          <img src="/img/icons/controller.svg" alt="" />
          <span>Play</span>
          <img src="/img/icons/arrow.svg" alt="" />
        </button>
        <span class="home__controller" aria-hidden="true"></span>
      </section>

      <section id="settings" class="settings is-hidden">
        <h1 class="settings__title">Settings</h1>

        <form class="settings__form" id="settings-form">
          <div class="settings__options">
            <fieldset class="settings__group">
              <legend>
                <img src="/img/icons/palette.svg" alt="" />
                <span>Game themes</span>
              </legend>
              <div class="settings__choices">
                <label><input type="radio" name="theme" value="code-vibes" /> Code vibes theme</label>
                <label><input type="radio" name="theme" value="da-projects" /> DA Projects theme</label>
                <label><input type="radio" name="theme" value="food" /> Foods theme</label>
              </div>
            </fieldset>

            <fieldset class="settings__group">
              <legend>
                <img src="/img/icons/chess_pawn.svg" alt="" />
                <span>Choose player</span>
              </legend>
              <div class="settings__choices">
                <label><input type="radio" name="player" value="blue" /> Blue</label>
                <label><input type="radio" name="player" value="orange" /> Orange</label>
              </div>
            </fieldset>

            <fieldset class="settings__group">
              <legend>
                <img src="/img/icons/style.svg" alt="" />
                <span>Board size</span>
              </legend>
              <div class="settings__choices">
                <label><input type="radio" name="size" value="4x4" /> 16 cards</label>
                <label><input type="radio" name="size" value="4x6" /> 24 cards</label>
                <label><input type="radio" name="size" value="6x6" /> 36 cards</label>
              </div>
            </fieldset>
          </div>

          <div class="settings__preview">
            <div class="settings__preview-img">
              <img id="theme-picture" src="/img/themes/code-vibes/preview.svg" alt="Vorschau des gewählten Themes" />
            </div>

            <div class="settings__summary">
              <span class="settings__chosen" data-group="theme">Game theme</span>
              <span class="settings__chosen" data-group="player">Player</span>
              <span class="settings__chosen" data-group="size">Board size</span>
              <button id="game-start-button" class="btn btn--start" type="submit" disabled>
                <img src="/img/icons/start.svg" alt="" />
                <span>Start</span>
              </button>
            </div>
          </div>
        </form>
      </section>

      <section id="game" class="game is-hidden">
        <div class="game__content">
          <header class="game__header">
            <div class="game__scores">
              <span class="game__score game__score--blue">
                <span class="game__score-name">Blue</span>
                <span id="score-blue">0</span>
              </span>
              <span class="game__score game__score--orange">
                <span class="game__score-name">Orange</span>
                <span id="score-orange">0</span>
              </span>
            </div>

            <p class="game__current">Current player: <span id="current-player" class="game__player-badge" role="img"></span></p>

            <button id="exit-button" class="btn btn--exit" type="button">
              <img src="/img/icons/exit.svg" alt="" />
              <span>Exit game</span>
            </button>
          </header>

          <div id="game-board" class="game__board"></div>
        </div>
      </section>

      <section id="game-over" class="result is-hidden">
        <h1 class="result__title result__title--game-over">Game over</h1>
        <p class="result__label result__label--small">Final score</p>
        <div class="result__scores">
          <p class="result__score result__score--blue">Blue <span id="final-score-blue">0</span></p>
          <p class="result__score result__score--orange">Orange <span id="final-score-orange">0</span></p>
        </div>
      </section>

      <section id="winner" class="result result--winner is-hidden">
        <picture class="result__confetti">
          <source media="(min-width: 1440px)" srcset="/img/icons/Confetti_long.svg" />
          <img src="/img/icons/Confetti.svg" alt="" />
        </picture>
        <div id="winner-result" class="result__winner"></div>
        <button id="back-to-start" class="btn result__button" type="button">Back to start</button>
      </section>
    </main>
    <dialog id="exit-dialog" class="exit-dialog">
      <div class="exit-dialog__wrapper">
        <p class="exit-dialog__text">
          Are you sure you want to quit <br />
          the game?
        </p>
        <div class="exit-dialog__actions">
          <button id="back-to-game" class="btn exit-dialog__button exit-dialog__button--back" type="button">Back to game</button>
          <button id="exit-game" class="btn exit-dialog__button exit-dialog__button--exit" type="button">Exit game</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
